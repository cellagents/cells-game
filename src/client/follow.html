<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Follow - Cells</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Floating button stack, same shape as the game and admin pages.
       Exit sends you back to the start menu; theme toggles light/dark;
       chat toggle hides/shows the chat overlay (hidden entirely when
       chat was disabled via ?chat=off). -->
  <a id="exit-to-menu" class="floating-btn exit-btn" href="/" aria-label="Return to menu" title="Return to menu">×</a>
  <button id="theme-toggle" class="floating-btn theme-toggle" type="button" aria-label="Toggle theme">◐</button>
  <button id="chat-toggle" class="floating-btn chat-btn" type="button" aria-label="Toggle chat" title="Toggle chat" hidden>≡</button>
  <button id="leaderboard-toggle" class="floating-btn leaderboard-btn" type="button" aria-label="Toggle leaderboard" title="Toggle leaderboard">▤</button>
  <button id="minimap-toggle" class="floating-btn minimap-btn" type="button" aria-label="Toggle minimap" title="Toggle minimap">◰</button>

  <canvas id="minimap" class="minimap"></canvas>

  <canvas id="game-canvas"></canvas>
  <!-- Status overlay. JS fills #status-message and toggles [hidden] on
       the wrapper. Sits above chat but below the floating button stack
       so the user can still toggle theme / exit while disconnected. -->
  <div id="status-overlay" class="status-overlay" hidden>
    <div class="status-card">
      <p id="status-message"></p>
      <a id="status-action" href="/" hidden>Back to lobby</a>
    </div>
  </div>
  <div class="leaderboard-panel">
    <div id="leaderboard"><span class="title">Leaderboard</span></div>
  </div>
  <div id="follow-info"></div>
  <!-- Mounted by follow.js when ?chat is not disabled. The shared
       chat module fills this container with its own markup. -->
  <div id="chatbox"></div>
  <script src="js/follow.js"></script>
</body>
</html>
