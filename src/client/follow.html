<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cells-game · follow</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Floating button stack, same shape as the game and admin pages.
       Exit sends you back to the start menu; theme toggles light/dark;
       chat toggle hides/shows the chat overlay (hidden entirely when
       chat was disabled via ?chat=off). -->
  <a id="exitToMenu" class="floating-btn exit-btn" href="/" aria-label="Return to menu" title="Return to menu">×</a>
  <button id="themeToggle" class="floating-btn theme-toggle" type="button" aria-label="Toggle theme">◐</button>
  <button id="chatToggle" class="floating-btn chat-btn" type="button" aria-label="Toggle chat" title="Toggle chat" hidden>≡</button>
  <button id="leaderboardToggle" class="floating-btn leaderboard-btn" type="button" aria-label="Toggle leaderboard" title="Toggle leaderboard">▤</button>

  <canvas id="cvs"></canvas>
  <!-- Status overlay. JS fills #statusMessage and toggles [hidden] on
       the wrapper. Sits above chat but below the floating button stack
       so the user can still toggle theme / exit while disconnected. -->
  <div id="statusOverlay" class="status-overlay" hidden>
    <div class="status-card">
      <p id="statusMessage"></p>
      <a id="statusAction" href="/" hidden>Back to lobby</a>
    </div>
  </div>
  <div class="sidebar">
    <div id="leaderboard"><span class="title">Leaderboard</span></div>
  </div>
  <div id="info"></div>
  <!-- Mounted by follow.js when ?chat is not disabled. The shared
       chat module fills this container with its own markup. -->
  <div id="chatbox"></div>
  <script src="js/follow.js"></script>
</body>
</html>
