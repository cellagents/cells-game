<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cells-game · admin</title>
  <link rel="stylesheet" href="css/thin.css" />
</head>
<body class="admin-page">
  <h1>Server admin</h1>
  <div class="row">
    <label for="server">Game server URL</label>
    <input id="server" type="text" placeholder="http://localhost:3000" />
  </div>
  <div class="row">
    <label for="token">Admin bearer token</label>
    <input id="token" type="password" placeholder="ADMIN_PASS value" />
  </div>

  <h2>Broadcast message</h2>
  <div class="row">
    <input id="broadcast-msg" type="text" placeholder="message to all players" />
    <button id="btn-broadcast">Send</button>
  </div>

  <div id="status" class="status">idle</div>

  <h2>Players <button id="btn-refresh" style="font-size:12px;padding:4px 8px">refresh</button></h2>
  <div id="players">loading...</div>

  <h2>Raw state</h2>
  <pre id="state">loading...</pre>

  <script src="js/admin.js"></script>
</body>
</html>
