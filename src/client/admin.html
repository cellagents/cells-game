<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cells-game · admin</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">◐</button>

  <section id="login-view" class="menu-wrapper" hidden>
    <div class="menu-card">
      <p class="menu-title">Server admin</p>
      <div id="login-status" class="status" hidden></div>
      <form id="login-form">
        <input id="login-token" type="password" placeholder="ADMIN_PASS value" autofocus />
        <button type="submit" id="btn-login" class="menu-button">Unlock</button>
      </form>
    </div>
  </section>

  <section id="admin-view" class="admin-dashboard" hidden>
    <header class="admin-header">
      <span class="admin-title">Server admin</span>
      <span class="session-meta">Session expires <code id="session-expiry">-</code></span>
      <button id="btn-logout" class="menu-button menu-button-sm">Lock</button>
    </header>

    <div class="admin-grid">
      <section class="overlay-panel">
        <div class="panel-title">Chat</div>
        <div id="chatbox"></div>
      </section>

      <section class="overlay-panel">
        <div class="panel-title">
          Players
          <button id="btn-refresh" class="menu-button menu-button-sm" type="button">refresh</button>
        </div>
        <div id="players" class="players-list">loading...</div>
      </section>

      <section class="overlay-panel">
        <div class="panel-title">Raw state</div>
        <pre id="state">loading...</pre>
      </section>
    </div>

    <div id="status" class="status" hidden></div>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
